---
# SSH configuration tasks

- name: Ensure SSH is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Configure SSH daemon
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
    backup: true
  loop:
    - regexp: '^#?Port '
      line: "Port {{ rpi_ssh_port }}"
    - regexp: '^#?PermitRootLogin '
      line: "PermitRootLogin {{ rpi_ssh_permit_root_login }}"
    - regexp: '^#?PasswordAuthentication '
      line: "PasswordAuthentication {{ rpi_ssh_password_authentication }}"
    - regexp: '^#?PubkeyAuthentication '
      line: "PubkeyAuthentication {{ rpi_ssh_pubkey_authentication }}"
  notify:
    - restart ssh
    - restart sshd

- name: Ensure SSH service is enabled and started
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
